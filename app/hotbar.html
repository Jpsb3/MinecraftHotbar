            decor:    { name: 'Decorador', icon: 'crafting_table.png' },
            drop:     { name: 'Arrastrar y soltar', icon: 'water_bucket.png' },
            craft:    { name: '¿Eso es crafteo?', icon: 'crafting_table.png' }
        };

        function progress() {
            if (!config.progress || typeof config.progress !== 'object') config.progress = {};
            const p = config.progress;
            if (!p.launches) p.launches = {};
            if (!p.unlocked) p.unlocked = {};
            return p;
        }

        var progressTimer = null;
        function saveProgressSoon() {
            clearTimeout(progressTimer);
            progressTimer = setTimeout(saveConfigToHost, 1500);
        }

        var configReady = false;
        function unlock(id, extra) {
            if (!configReady) return;                 // no dar logros antes de leer los guardados
            const p = progress();
            if (p.unlocked[id]) return;
            const def = ACHIEVEMENTS[id];
            if (!def) return;
            p.unlocked[id] = new Date().toISOString();
            saveProgressSoon();
            showToast(Object.assign({}, def, extra || {}));
        }

        const toastEl = document.getElementById('toast');
        const toastQueue = [];
        var toastBusy = false;
        function showToast(t) {
            toastQueue.push(t);
            if (!toastBusy) nextToast();
        }
        function nextToast() {
            const t = toastQueue.shift();
            if (!t) { toastBusy = false; return; }
            toastBusy = true;
            toastEl.classList.toggle('challenge', t.kind === 'challenge');
            toastEl.classList.toggle('tip', t.kind === 'tip');
            document.getElementById('toast-title').textContent =
                t.title || (t.kind === 'challenge' ? '¡Desafío completado!' : '¡Logro conseguido!');
            document.getElementById('toast-name').textContent = t.name;
            document.getElementById('toast-icon').src = `assets/items/${t.icon || 'diamond.png'}`;
            toastEl.classList.add('show');
            setTimeout(reportRegions, 420);            // cuando termina de bajar
            playSound(t.kind === 'challenge' ? 'challenge' : 'toastIn');
            setTimeout(() => {
                toastEl.classList.remove('show');
                setTimeout(nextToast, 450);
            }, t.kind === 'tip' ? 7000 : 4500);
        }

        function afterConfigLoaded() {
            configReady = true;
            progress();
            applyRunning();
            // La primera vez: el consejo de la tecla E
            setTimeout(() => unlock('welcome'), 1200);
        }

        // ========================================================
        // FORMA DE LA VENTANA: se le dice a C# qué partes se ven,
        // para que solo ahí reciba clics (el resto pasa al escritorio)
        // ========================================================
        let lastRegions = '';
        // Los corazones, la comida y el número del nivel tienen forma irregular:
        // en vez de un rectángulo (que dejaría un fondo gris alrededor), se manda su silueta exacta.
        const maskCache = new Map();
        function runsFromCanvas(c) {
            const w = c.width, h = c.height;
            if (!w || !h) return null;
            const d = c.getContext('2d').getImageData(0, 0, w, h).data;
            const runs = [];
            for (let y = 0; y < h; y++) {
                let start = -1;
                for (let x = 0; x <= w; x++) {
                    const a = x < w ? d[(y * w + x) * 4 + 3] : 0;
                    if (a > 20 && start < 0) start = x;
                    else if (a <= 20 && start >= 0) { runs.push([start, y, x - start]); start = -1; }
                }
            }
            return { w, h, runs };
        }
        function maskFromImage(img) {
            if (!img.complete || !img.naturalWidth) return null;
            let m = maskCache.get(img.src);
            if (!m) {
                const c = document.createElement('canvas');
                c.width = img.naturalWidth; c.height = img.naturalHeight;
                c.getContext('2d').drawImage(img, 0, 0);
                m = runsFromCanvas(c);
                maskCache.set(img.src, m);
            }
            return m;
        }
        function maskedRects(el, mask) {
            if (!mask) return [];
            const r = el.getBoundingClientRect();
            const sx = r.width / mask.w, sy = r.height / mask.h;
            return mask.runs.map(([x, y, len]) => ({ x: r.left + x * sx, y: r.top + y * sy, w: len * sx, h: sy }));
        }

        function reportRegions() {
            if (!(window.chrome && window.chrome.webview)) return;
            const PAD = 4;
            const boxes = [document.querySelector('.hotbar-container'), selectionBox];
            if (tooltip.classList.contains('show')) boxes.push(tooltip);
            if (toastEl.classList.contains('show')) boxes.push(toastEl);
            if (inventoryModal.classList.contains('open')) {
                boxes.push(inventoryModal);
                if (recipeDrawer && recipeDrawer.classList.contains('open')) boxes.push(recipeDrawer);
                if (slotEditPopover && slotEditPopover.classList.contains('open')) boxes.push(slotEditPopover);
            }
            let rects = boxes.filter(Boolean).map(el => {
                const r = el.getBoundingClientRect();
                return { x: Math.max(0, r.left - PAD), y: Math.max(0, r.top - PAD), w: r.width + PAD * 2, h: r.height + PAD * 2 };
            }).filter(r => r.w > PAD * 2 && r.h > PAD * 2);

            if (!hud.classList.contains('hidden')) {
                const xr = xpBar.getBoundingClientRect();
                rects.push({ x: xr.left, y: xr.top, w: xr.width, h: xr.height });
                document.querySelectorAll('.hud-icon').forEach(img => { rects = rects.concat(maskedRects(img, maskFromImage(img))); });
                rects = rects.concat(maskedRects(levelCanvas, levelMask));
            }

            const key = JSON.stringify(rects.map(r => [r.x, r.y, r.w, r.h].map(v => Math.round(v * 2))));
            if (key === lastRegions) return;
            lastRegions = key;
            window.chrome.webview.postMessage({ action: 'regions', dpr: window.devicePixelRatio, rects });
        }
        function scheduleRegions() {
            requestAnimationFrame(reportRegions);
            setTimeout(reportRegions, 260); // después de las animaciones (tooltip, inventario)
        }
        new MutationObserver(scheduleRegions).observe(document.body, { attributes: true, subtree: true, attributeFilter: ['class', 'style'] });
        window.addEventListener('resize', () => { lastRegions = ''; scheduleRegions(); });

        // Registro de clics en hotbar.log (para diagnosticar si los clics llegan)
        document.addEventListener('mousedown', (e) => {
            if (window.chrome && window.chrome.webview) {
                const t = e.target.closest('.slot, button, input, select, .grid-item');
                window.chrome.webview.postMessage({ action: 'log', msg: 'clic en ' + (t ? (t.id || t.className || t.tagName) : e.target.tagName) });
            }
        });

        // Cargar config.json local si está disponible
        fetch('config.json')
            .then(res => res.json())
            .then(data => {
                config = data;
                ensureConfigArrays();
                renderHotbar();
                afterConfigLoaded();
            })
            .catch(() => {
                ensureConfigArrays();
                renderHotbar();
                afterConfigLoaded();
            });
    </script>
</body>
</html>
